name: Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'testnet'
        type: choice
        options:
        - testnet
        - mainnet

env:
  FORGE_PROFILE: ci
  SOLC_VERSION: 0.8.27

jobs:
  deploy-testnet:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'testnet')

    environment: testnet
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly

    - name: Install dependencies
      run: |
        forge install foundry-rs/forge-std --no-commit
        forge install OpenZeppelin/openzeppelin-contracts --no-commit
        forge install Layr-Labs/eigenlayer-contracts --no-commit
        forge install Uniswap/v4-core --no-commit
        forge install Uniswap/v4-periphery --no-commit
        forge install across-protocol/contracts --no-commit

    - name: Build contracts
      run: forge build --optimize --optimizer-runs 10000

    - name: Deploy to testnet
      run: |
        forge script script/Deploy.s.sol \
          --rpc-url ${{ secrets.TESTNET_RPC_URL }} \
          --broadcast \
          --verify \
          --etherscan-api-key ${{ secrets.ETHERSCAN_API_KEY }}
      env:
        PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}

    - name: Setup AVS on testnet
      run: |
        forge script script/SetupAVS.s.sol \
          --rpc-url ${{ secrets.TESTNET_RPC_URL }} \
          --broadcast
      env:
        PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}

    - name: Configure chains
      run: |
        forge script script/ConfigureChains.s.sol \
          --rpc-url ${{ secrets.TESTNET_RPC_URL }} \
          --broadcast
      env:
        PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}

  deploy-mainnet:
    name: Deploy to Mainnet
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'mainnet')

    environment: mainnet
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly

    - name: Install dependencies
      run: |
        forge install foundry-rs/forge-std --no-commit
        forge install OpenZeppelin/openzeppelin-contracts --no-commit
        forge install Layr-Labs/eigenlayer-contracts --no-commit
        forge install Uniswap/v4-core --no-commit
        forge install Uniswap/v4-periphery --no-commit
        forge install across-protocol/contracts --no-commit

    - name: Build contracts
      run: forge build --optimize --optimizer-runs 10000

    - name: Deploy to mainnet
      run: |
        forge script script/Deploy.s.sol \
          --rpc-url ${{ secrets.MAINNET_RPC_URL }} \
          --broadcast \
          --verify \
          --etherscan-api-key ${{ secrets.ETHERSCAN_API_KEY }}
      env:
        PRIVATE_KEY: ${{ secrets.MAINNET_PRIVATE_KEY }}

    - name: Setup AVS on mainnet
      run: |
        forge script script/SetupAVS.s.sol \
          --rpc-url ${{ secrets.MAINNET_RPC_URL }} \
          --broadcast
      env:
        PRIVATE_KEY: ${{ secrets.MAINNET_PRIVATE_KEY }}

    - name: Configure chains
      run: |
        forge script script/ConfigureChains.s.sol \
          --rpc-url ${{ secrets.MAINNET_RPC_URL }} \
          --broadcast
      env:
        PRIVATE_KEY: ${{ secrets.MAINNET_PRIVATE_KEY }}

    - name: Register operator
      run: |
        forge script script/RegisterOperator.s.sol \
          --rpc-url ${{ secrets.MAINNET_RPC_URL }} \
          --broadcast
      env:
        PRIVATE_KEY: ${{ secrets.MAINNET_PRIVATE_KEY }}

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-testnet, deploy-mainnet]
    if: always()

    steps:
    - name: Notify Discord
      uses: Ilshidur/action-discord@master
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      with:
        args: |
          🚀 **SyncHook Deployment Complete**
          
          **Environment:** ${{ github.ref == 'refs/heads/main' && 'Testnet' || 'Mainnet' }}
          **Commit:** ${{ github.sha }}
          **Status:** ${{ needs.deploy-testnet.result || needs.deploy-mainnet.result }}
          
          [View Deployment](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})