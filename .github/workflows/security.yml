name: Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday at 2 AM

env:
  FORGE_PROFILE: ci
  SOLC_VERSION: 0.8.27

jobs:
  slither:
    name: Slither Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly

    - name: Install dependencies
      run: |
        forge install foundry-rs/forge-std --no-commit
        forge install OpenZeppelin/openzeppelin-contracts --no-commit
        forge install Layr-Labs/eigenlayer-contracts --no-commit
        forge install Uniswap/v4-core --no-commit
        forge install Uniswap/v4-periphery --no-commit
        forge install across-protocol/contracts --no-commit

    - name: Build contracts
      run: forge build

    - name: Run Slither
      uses: crytic/slither-action@v0.2.0
      with:
        target: 'src/'
        args: '--filter-paths "lib/" --exclude-informational --exclude-low --exclude-medium --json slither-report.json'

    - name: Upload Slither results
      uses: actions/upload-artifact@v3
      with:
        name: slither-report
        path: slither-report.json

  mythril:
    name: Mythril Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly

    - name: Install dependencies
      run: |
        forge install foundry-rs/forge-std --no-commit
        forge install OpenZeppelin/openzeppelin-contracts --no-commit
        forge install Layr-Labs/eigenlayer-contracts --no-commit
        forge install Uniswap/v4-core --no-commit
        forge install Uniswap/v4-periphery --no-commit
        forge install across-protocol/contracts --no-commit

    - name: Build contracts
      run: forge build

    - name: Install Mythril
      run: |
        pip install mythril

    - name: Run Mythril analysis
      run: |
        myth analyze src/hooks/SyncHook.sol --execution-timeout 300
        myth analyze src/avs/SyncAVS.sol --execution-timeout 300
        myth analyze src/integration/AcrossIntegration.sol --execution-timeout 300

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly

    - name: Install dependencies
      run: |
        forge install foundry-rs/forge-std --no-commit
        forge install OpenZeppelin/openzeppelin-contracts --no-commit
        forge install Layr-Labs/eigenlayer-contracts --no-commit
        forge install Uniswap/v4-core --no-commit
        forge install Uniswap/v4-periphery --no-commit
        forge install across-protocol/contracts --no-commit

    - name: Check for known vulnerabilities
      run: |
        forge build
        # Check for known vulnerabilities in dependencies
        echo "Checking for known vulnerabilities in dependencies..."

  fuzzing:
    name: Advanced Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly

    - name: Install dependencies
      run: |
        forge install foundry-rs/forge-std --no-commit
        forge install OpenZeppelin/openzeppelin-contracts --no-commit
        forge install Layr-Labs/eigenlayer-contracts --no-commit
        forge install Uniswap/v4-core --no-commit
        forge install Uniswap/v4-periphery --no-commit
        forge install across-protocol/contracts --no-commit

    - name: Run extended fuzz tests
      run: |
        forge test --match-path "test/fuzz/**/*.sol" --fuzz-runs 10000 -vv

    - name: Run invariant tests
      run: |
        forge test --match-path "test/invariant/**/*.sol" --invariant-runs 1000 -vv

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [slither, mythril, dependency-check, fuzzing]
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Slither results
      uses: actions/download-artifact@v3
      with:
        name: slither-report
        path: ./reports

    - name: Generate security summary
      run: |
        echo "# Security Audit Report" > security-report.md
        echo "Generated on: $(date)" >> security-report.md
        echo "" >> security-report.md
        echo "## Test Results" >> security-report.md
        echo "- Slither: ${{ needs.slither.result }}" >> security-report.md
        echo "- Mythril: ${{ needs.mythril.result }}" >> security-report.md
        echo "- Dependency Check: ${{ needs.dependency-check.result }}" >> security-report.md
        echo "- Fuzzing: ${{ needs.fuzzing.result }}" >> security-report.md

    - name: Upload security report
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: security-report.md
