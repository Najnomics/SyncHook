name: Benchmark

on:
  schedule:
    - cron: '0 3 * * *' # Daily at 3 AM
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  gas-benchmark:
    name: Gas Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: |
          forge install --no-commit

      - name: Build
        run: forge build

      - name: Run gas benchmark
        run: |
          forge test --gas-report > gas-benchmark.txt
          
          # Extract key metrics
          echo "# Gas Benchmark Report" > benchmark-report.md
          echo "Generated on: $(date)" >> benchmark-report.md
          echo "" >> benchmark-report.md
          
          # Find highest gas usage functions
          echo "## Highest Gas Usage Functions" >> benchmark-report.md
          grep -E "Max.*[0-9]{6,}" gas-benchmark.txt | sort -k5 -nr | head -10 >> benchmark-report.md
          
          echo "" >> benchmark-report.md
          echo "## Average Gas Usage" >> benchmark-report.md
          grep -E "Avg.*[0-9]+" gas-benchmark.txt | sort -k3 -nr | head -10 >> benchmark-report.md

      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: gas-benchmark
          path: |
            gas-benchmark.txt
            benchmark-report.md

  performance-benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: |
          forge install --no-commit

      - name: Build
        run: forge build

      - name: Run performance tests
        run: |
          # Measure test execution time
          time forge test > performance-test.txt 2>&1
          
          # Measure compilation time
          time forge build > compilation-time.txt 2>&1
          
          # Generate performance report
          echo "# Performance Benchmark Report" > performance-report.md
          echo "Generated on: $(date)" >> performance-report.md
          echo "" >> performance-report.md
          
          echo "## Test Execution Time" >> performance-report.md
          grep -E "real|user|sys" performance-test.txt >> performance-report.md
          
          echo "" >> performance-report.md
          echo "## Compilation Time" >> performance-report.md
          grep -E "real|user|sys" compilation-time.txt >> performance-report.md

      - name: Upload performance results
        uses: actions/upload-artifact@v3
        with:
          name: performance-benchmark
          path: |
            performance-test.txt
            compilation-time.txt
            performance-report.md

  regression-detection:
    name: Regression Detection
    runs-on: ubuntu-latest
    needs: [gas-benchmark, performance-benchmark]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download benchmark results
        uses: actions/download-artifact@v3
        with:
          path: benchmark-results

      - name: Compare with previous results
        run: |
          echo "# Regression Analysis" > regression-report.md
          echo "Generated on: $(date)" >> regression-report.md
          echo "" >> regression-report.md
          
          # This would typically compare with previous benchmark results
          # For now, just note that comparison is needed
          echo "## Gas Usage Comparison" >> regression-report.md
          echo "Previous results not available for comparison" >> regression-report.md
          echo "" >> regression-report.md
          echo "## Performance Comparison" >> regression-report.md
          echo "Previous results not available for comparison" >> regression-report.md

      - name: Upload regression analysis
        uses: actions/upload-artifact@v3
        with:
          name: regression-analysis
          path: regression-report.md
