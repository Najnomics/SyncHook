name: Fuzz Testing

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  fuzz-testing:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      matrix:
        test-suite: [SyncAVS, SyncHook, StateValidation, ChainRegistry, StateOracles, AcrossIntegration, SyncTaskManager]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: |
          forge install --no-commit

      - name: Build
        run: forge build

      - name: Run fuzz tests for ${{ matrix.test-suite }}
        run: |
          forge test --match-contract "${{ matrix.test-suite }}Fuzz" --fuzz-runs 10000 --fuzz-seed ${{ github.run_number }}

      - name: Run invariant tests for ${{ matrix.test-suite }}
        run: |
          forge test --match-contract "${{ matrix.test-suite }}Invariant" --fuzz-runs 10000 --fuzz-seed ${{ github.run_number }}

      - name: Upload fuzz results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: fuzz-results-${{ matrix.test-suite }}
          path: |
            cache/fuzz/
            out/

  fuzz-analysis:
    name: Fuzz Analysis
    runs-on: ubuntu-latest
    needs: fuzz-testing
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download fuzz results
        uses: actions/download-artifact@v5
        with:
          path: fuzz-results

      - name: Analyze fuzz results
        run: |
          echo "# Fuzz Testing Analysis" > fuzz-analysis.md
          echo "Generated on: $(date)" >> fuzz-analysis.md
          echo "" >> fuzz-analysis.md
          
          # Count total fuzz runs
          total_runs=$(find fuzz-results -name "*.json" | wc -l)
          echo "Total fuzz test runs: $total_runs" >> fuzz-analysis.md
          echo "" >> fuzz-analysis.md
          
          # Check for failures
          if find fuzz-results -name "failures" -type d | grep -q .; then
            echo "## Failures Found" >> fuzz-analysis.md
            find fuzz-results -name "failures" -type d -exec ls -la {} \; >> fuzz-analysis.md
          else
            echo "## No Failures Found" >> fuzz-analysis.md
          fi

      - name: Upload fuzz analysis
        uses: actions/upload-artifact@v3
        with:
          name: fuzz-analysis
          path: fuzz-analysis.md

  performance-testing:
    name: Performance Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: |
          forge install --no-commit

      - name: Build
        run: forge build

      - name: Run performance tests
        run: |
          # Run tests with gas reporting
          forge test --gas-report > gas-report.txt
          
          # Check for high gas usage
          echo "## Gas Usage Analysis" > performance-report.md
          echo "Generated on: $(date)" >> performance-report.md
          echo "" >> performance-report.md
          
          # Extract high gas usage functions
          grep -E "Max.*[0-9]{6,}" gas-report.txt >> performance-report.md || echo "No high gas usage detected" >> performance-report.md

      - name: Upload performance report
        uses: actions/upload-artifact@v3
        with:
          name: performance-report
          path: |
            gas-report.txt
            performance-report.md
