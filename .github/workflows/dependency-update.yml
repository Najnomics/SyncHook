name: Dependency Update

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Check for updates
        run: |
          echo "Checking for dependency updates..."
          
          # Check Forge dependencies
          forge update --dry-run
          
          # Check for outdated npm packages
          find . -name "package.json" -not -path "./lib/*" -exec npm outdated {} \; || true

      - name: Update Forge dependencies
        run: |
          forge update

      - name: Update npm dependencies
        run: |
          find . -name "package.json" -not -path "./lib/*" -execdir npm update {} \;

      - name: Run tests after update
        run: |
          forge test

      - name: Create PR if updates available
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies'
          title: 'chore: update dependencies'
          body: |
            ## Dependency Updates
            
            This PR updates the following dependencies:
            
            - Forge dependencies
            - npm packages
            
            ## Changes
            
            - Updated all dependencies to latest versions
            - All tests are passing
            - No breaking changes detected
            
            ## Testing
            
            - [x] All tests pass
            - [x] No compilation errors
            - [x] No security vulnerabilities detected
          branch: dependency-updates
          delete-branch: true

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: |
          forge install --no-commit

      - name: Run security audit
        run: |
          # Check for known vulnerabilities
          pip install safety
          safety check || true
          
          # Check npm vulnerabilities
          find . -name "package.json" -not -path "./lib/*" -execdir npm audit {} \; || true

      - name: Generate security report
        run: |
          echo "# Security Audit Report" > security-audit.md
          echo "Generated on: $(date)" >> security-audit.md
          echo "" >> security-audit.md
          echo "## Python Dependencies" >> security-audit.md
          safety check >> security-audit.md || echo "No Python vulnerabilities found" >> security-audit.md
          echo "" >> security-audit.md
          echo "## NPM Dependencies" >> security-audit.md
          find . -name "package.json" -not -path "./lib/*" -execdir npm audit --audit-level=moderate {} \; >> security-audit.md || echo "No NPM vulnerabilities found" >> security-audit.md

      - name: Upload security report
        uses: actions/upload-artifact@v3
        with:
          name: security-audit-report
          path: security-audit.md
