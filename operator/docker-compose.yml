version: '3.8'

services:
  # SyncHook Aggregator
  aggregator:
    build:
      context: .
      dockerfile: Dockerfile.aggregator
    container_name: synchook-aggregator
    ports:
      - "8090:8090"  # gRPC server
      - "8080:8080"  # HTTP server
      - "9090:9090"  # Metrics
    volumes:
      - ./config/aggregator.yaml:/app/config/aggregator.yaml:ro
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=info
      - LOG_FORMAT=json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # SyncHook Operator
  operator:
    build:
      context: .
      dockerfile: Dockerfile.operator
    container_name: synchook-operator
    ports:
      - "9091:9091"  # Node API
    volumes:
      - ./config/operator.yaml:/app/config/operator.yaml:ro
      - ./keys:/app/keys:ro
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=info
      - LOG_FORMAT=json
    depends_on:
      aggregator:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: synchook-prometheus
    ports:
      - "9092:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: synchook-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: synchook-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  redis_data:

networks:
  default:
    name: synchook-network
