# SyncHook AVS Operator Configuration

# Operator Identity
ecdsa_private_key_store_path: "./keys/operator.ecdsa.key.json"
bls_private_key_store_path: "./keys/operator.bls.key.json"

# Ethereum Configuration
eth_rpc_url: "http://localhost:8545"
eth_ws_url: "ws://localhost:8546"

# EigenLayer Configuration
registry_coordinator_address: "0x0000000000000000000000000000000000000000"
operator_state_retriever_address: "0x0000000000000000000000000000000000000000"
aggregator_server_ip_port_address: "localhost:8090"
register_operator_on_startup: true

# Metrics Configuration
eigen_metrics_ip_port_address: "localhost:9090"
enable_metrics: true

# Node API Configuration
node_api_ip_port_address: "localhost:9091"
enable_node_api: true

# SyncHook Specific Configuration
sync_avs_address: "0x0000000000000000000000000000000000000000"
across_address: "0x0000000000000000000000000000000000000000"

# Supported Chains
supported_chains:
  - chain_id: 1
    name: "Ethereum"
    rpc_url: "http://localhost:8545"
    block_time: 12
    gas_price: 20000000000
  - chain_id: 42161
    name: "Arbitrum"
    rpc_url: "http://localhost:8547"
    block_time: 1
    gas_price: 1000000000
  - chain_id: 137
    name: "Polygon"
    rpc_url: "http://localhost:8548"
    block_time: 2
    gas_price: 30000000000
  - chain_id: 10
    name: "Optimism"
    rpc_url: "http://localhost:8549"
    block_time: 2
    gas_price: 1000000000
  - chain_id: 8453
    name: "Base"
    rpc_url: "http://localhost:8550"
    block_time: 2
    gas_price: 1000000000

# State Management
state_update_interval: 30  # seconds
rebalancing_threshold: 0.05  # 5%
max_rebalancing_amount: "1000000000000000000000000"  # 1M tokens
min_rebalancing_amount: "1000000000000000000000"  # 1K tokens

# Monitoring
enable_monitoring: true
alert_thresholds:
  price_deviation: 0.1  # 10%
  liquidity_imbalance: 0.2  # 20%
  response_time: 30  # seconds

# Logging
log_level: "info"
log_format: "json"
