eigenlayer:
  registry_coordinator: "0x1234567890abcdef1234567890abcdef12345678"
  stake_registry: "0x1234567890abcdef1234567890abcdef12345678"
  bls_apk_registry: "0x1234567890abcdef1234567890abcdef12345678"
  index_registry: "0x1234567890abcdef1234567890abcdef12345678"
  operator_id: 1
  quorum_number: 0
  minimum_stake: "1000000000000000000000" # 1000 ETH
  slashing_threshold: "100000000000000000000" # 100 ETH

across:
  spoke_pool: "0x1234567890abcdef1234567890abcdef12345678"
  hub_pool: "0x1234567890abcdef1234567890abcdef12345678"
  relayer_fee_pct: "0.001" # 0.1%
  max_gas_price: "20000000000" # 20 gwei
  bridge_fee_bps: 10 # 0.1%
  max_rebalancing_amount: "1000000000000000000000000" # 1M tokens
  min_rebalancing_amount: "1000000000000000000000" # 1K tokens
  rebalancing_cooldown: 100 # blocks

log:
  level: "info"
  format: "json"
  output: "stdout"
  file: "" # Set to enable file logging

operator:
  state_update_interval: "30s"
  rebalance_threshold: 0.05 # 5%
  max_rebalance_amount: "1000000000000000000000" # 1000 ETH
  min_rebalance_amount: "1000000000000000000" # 1 ETH
  rebalance_cooldown: "300s" # 5 minutes
  max_price_deviation: 0.05 # 5%
  max_liquidity_change: 0.1 # 10%
  max_time_gap: 300 # 5 minutes
  minimum_confirmations: 3

monitoring:
  enable_metrics: true
  metrics_port: 9090
  health_check_interval: "10s"
  alert_webhook: "" # Set to enable Discord/Slack alerts

predictive_analytics:
  enable: true
  time_horizon: 3600 # 1 hour in seconds
  confidence_threshold: 0.7 # 70%
  max_prediction_interval: 7200 # 2 hours in seconds
