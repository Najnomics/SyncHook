[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.27"
optimizer = true
optimizer_runs = 200
via_ir = true
verbosity = 2
fuzz = { runs = 1000, max_test_rejects = 65536 }
invariant = { runs = 256, depth = 15, fail_on_revert = false, call_override = false }
ffi = false
evm_version = "shanghai"
gas_reports = ["*"]
gas_reports_ignore = ["Mock*", "Test*"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/src/",
    "@eigenlayer/contracts/=lib/eigenlayer-contracts/src/contracts/",
    "@eigenlayer-middleware/=lib/eigenlayer-middleware/src/",
    "forge-std/=lib/forge-std/src/",
    "ds-test/=lib/ds-test/src/"
]

[profile.ci]
fuzz = { runs = 10000, max_test_rejects = 65536 }
invariant = { runs = 1000, depth = 20, fail_on_revert = false, call_override = false }

[profile.lite]
fuzz = { runs = 100, max_test_rejects = 65536 }
invariant = { runs = 50, depth = 10, fail_on_revert = false, call_override = false }

[profile.coverage]
fuzz = { runs = 1000, max_test_rejects = 65536 }
invariant = { runs = 256, depth = 15, fail_on_revert = false, call_override = false }
gas_reports = ["*"]
gas_reports_ignore = ["Mock*", "Test*"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"

[doc]
out = "docs"